name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26  # the macOS 26 SDK is needed for the Liquid Glass code paths
    steps:
      - uses: actions/checkout@v5
      - name: Build universal app
        env:
          TRUE_VERSION: ${{ github.ref_name }}
        run: scripts/make-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/True-macOS.zip dist/True-macOS.zip.sha256 \
            --title "True $GITHUB_REF_NAME" --generate-notes --latest

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.3 (tags main as v1.1.3)'
        required: true
permissions:
  contents: write
jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.t.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: t
        run: |
          V="v${{ inputs.version }}"; V="${V#vv}"; V="v${V#v}"
          echo "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version $V"; exit 1; }
          git ls-remote --exit-code --tags origin "$V" && { echo "::error::$V already exists"; exit 1; }
          git tag "$V" && git push origin "$V"
          echo "ref=$V" >> "$GITHUB_OUTPUT"
  build:
    needs: tag
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: macos-26  # the macOS 26 SDK is needed for the Liquid Glass code paths
    env:
      REL: ${{ needs.tag.outputs.ref || github.ref_name }}
      TRUE_UPDATE_PUBKEY: ${{ vars.TRUE_UPDATE_PUBKEY }}
    steps:
      - name: Require the update public key
        run: |
          [ -n "$TRUE_UPDATE_PUBKEY" ] || { echo "::error::vars.TRUE_UPDATE_PUBKEY is empty. Run scripts/gen-update-key.sh once, then the gh variable set command it prints."; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.ref || github.ref }}
      - name: Build
        run: swift build -j 4
      - name: Test
        run: swift test -j 4 --no-parallel
      - name: Import the signing certificate
        # A stable certificate keeps the designated requirement the same across updates, so users keep their
        # mic / Automation / Accessibility grants. The identity lives in secrets, only in a throwaway keychain.
        env:
          P12: ${{ secrets.TRUE_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.TRUE_SIGN_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::secrets.TRUE_SIGN_P12 is empty; refusing to ship an ad-hoc build"; exit 1; }
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"; echo "::add-mask::$KP"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # The certificate is self-signed, so a fresh runner doesn't trust it and codesign won't use it: trust it for code signing only.
          security find-certificate -c "Deck Signing" -p "$KC" > "$RUNNER_TEMP/sign.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.cer"
          security find-identity -v -p codesigning "$KC"
          { echo "TRUE_SIGN_IDENTITY=Deck Signing"; echo "TRUE_SIGN_KEYCHAIN=$KC"; echo "TRUE_SIGN_KEYCHAIN_PASSWORD=$KP"; } >> "$GITHUB_ENV"
      - name: Build universal app
        env:
          TRUE_VERSION: ${{ env.REL }}
        run: scripts/make-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: True-macOS
          path: |
            dist/True-macOS.zip
            dist/True-macOS.zip.sha256
  smoke:
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: True-macOS
          path: artifact
      - name: Unpack
        run: ditto -x -k artifact/True-macOS.zip unpacked
      - name: Assert minimum OS 14.0 on both arches and in Info.plist
        run: |
          APP=unpacked/True.app
          BIN="$APP/Contents/MacOS/True"
          for arch in arm64 x86_64; do
            lipo "$BIN" -thin "$arch" -output "/tmp/True-$arch"
            vtool -show-build "/tmp/True-$arch" | tee "/tmp/vtool-$arch.txt"
            grep -q "minos 14.0" "/tmp/vtool-$arch.txt" || { echo "::error::$arch minos is not 14.0"; exit 1; }
          done
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$MIN"
          [ "$MIN" = "14.0" ] || { echo "::error::LSMinimumSystemVersion is $MIN"; exit 1; }
      - name: Assert updater repo, version and signature
        env:
          REL: ${{ needs.tag.outputs.ref || github.ref_name }}
        run: |
          APP=unpacked/True.app; PL="$APP/Contents/Info.plist"
          REPO=$(/usr/libexec/PlistBuddy -c 'Print :TrueUpdateRepo' "$PL")
          [ "$REPO" = "$GITHUB_REPOSITORY" ] || { echo "::error::TrueUpdateRepo is '$REPO'"; exit 1; }
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")
          KEY=$(/usr/libexec/PlistBuddy -c 'Print :TrueUpdatePublicKey' "$PL" 2>/dev/null || true)
          [ -n "$KEY" ] || { echo "::error::app has no TrueUpdatePublicKey"; exit 1; }
          [ "$KEY" = "${{ vars.TRUE_UPDATE_PUBKEY }}" ] || { echo "::error::embedded key differs from vars.TRUE_UPDATE_PUBKEY"; exit 1; }
          [ "v$VER" = "$REL" ] || { echo "::error::app version $VER != tag $REL"; exit 1; }
          codesign -v "$APP" || { echo "::error::codesign verify failed"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -q "^Authority=Deck Signing$" || { echo "::error::not signed with the stable certificate (ad-hoc build?)"; exit 1; }
          (cd artifact && shasum -a 256 -c True-macOS.zip.sha256)
      - name: Launch and check it stays alive
        run: |
          APP="$PWD/unpacked/True.app"
          xattr -dr com.apple.quarantine "$APP" || true
          mkdir -p "$HOME/Library/Logs/DiagnosticReports"
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep '^True' | sort > /tmp/crash-before.txt || true
          "$APP/Contents/MacOS/True" &
          PID=$!
          sleep 20
          screencapture -x "$PWD/smoke-${{ matrix.os }}.png" || echo "screencapture unavailable (non-fatal)"
          FAIL=0
          if ! kill -0 "$PID" 2>/dev/null; then echo "::error::True exited within 20 s"; FAIL=1; fi
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep '^True' | sort > /tmp/crash-after.txt || true
          NEW=$(comm -13 /tmp/crash-before.txt /tmp/crash-after.txt)
          if [ -n "$NEW" ]; then
            echo "::error::new crash report(s): $NEW"
            for f in $NEW; do cat "$HOME/Library/Logs/DiagnosticReports/$f"; done
            FAIL=1
          fi
          kill "$PID" 2>/dev/null || true
          exit $FAIL
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-${{ matrix.os }}.png
          if-no-files-found: ignore
  publish:
    needs: [tag, build, smoke]
    if: always() && needs.build.result == 'success' && needs.smoke.result == 'success'
    runs-on: macos-26
    env:
      REL: ${{ needs.tag.outputs.ref || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: True-macOS
          path: dist
      - name: Publish as a DRAFT (scripts/sign-release.sh signs it and makes it Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REL" dist/True-macOS.zip dist/True-macOS.zip.sha256 \
            --title "True $REL" --generate-notes --draft --repo "$GITHUB_REPOSITORY"
          echo "Draft $REL created. Now run on your Mac: scripts/sign-release.sh ${REL#v}" >> "$GITHUB_STEP_SUMMARY"

name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26  # the macOS 26 SDK is needed for the Liquid Glass code paths
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -j 4
      - name: Test
        # Serial: the hosted runner has ~3 cores, and parallel suites starve the timing/socket tests.
        run: swift test -j 4 --no-parallel
      - name: Build universal app for the smoke test
        env:
          TRUE_UPDATE_PUBKEY: ${{ vars.TRUE_UPDATE_PUBKEY }}
        run: scripts/make-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: True-macOS
          path: dist/True-macOS.zip
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: True-macOS
          path: artifact
      - name: Unpack
        run: ditto -x -k artifact/True-macOS.zip unpacked
      - name: Assert minimum OS 14.0 on both arches and in Info.plist
        run: |
          APP=unpacked/True.app
          BIN="$APP/Contents/MacOS/True"
          for arch in arm64 x86_64; do
            lipo "$BIN" -thin "$arch" -output "/tmp/True-$arch"
            vtool -show-build "/tmp/True-$arch" | tee "/tmp/vtool-$arch.txt"
            grep -q "minos 14.0" "/tmp/vtool-$arch.txt" || { echo "::error::$arch minos is not 14.0"; exit 1; }
          done
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$MIN"
          [ "$MIN" = "14.0" ] || { echo "::error::LSMinimumSystemVersion is $MIN"; exit 1; }
      - name: Launch and check it stays alive
        run: |
          APP="$PWD/unpacked/True.app"
          xattr -dr com.apple.quarantine "$APP" || true
          mkdir -p "$HOME/Library/Logs/DiagnosticReports"
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep '^True' | sort > /tmp/crash-before.txt || true
          "$APP/Contents/MacOS/True" &
          PID=$!
          sleep 20
          screencapture -x "$PWD/smoke-${{ matrix.os }}.png" || echo "screencapture unavailable (non-fatal)"
          FAIL=0
          if ! kill -0 "$PID" 2>/dev/null; then echo "::error::True exited within 20 s"; FAIL=1; fi
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep '^True' | sort > /tmp/crash-after.txt || true
          NEW=$(comm -13 /tmp/crash-before.txt /tmp/crash-after.txt)
          if [ -n "$NEW" ]; then
            echo "::error::new crash report(s): $NEW"
            for f in $NEW; do cat "$HOME/Library/Logs/DiagnosticReports/$f"; done
            FAIL=1
          fi
          kill "$PID" 2>/dev/null || true
          exit $FAIL
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-${{ matrix.os }}.png
          if-no-files-found: ignore
